<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BTS Fan World 💜</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #12001f, #3b176d, #160025);
            color: white;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            font-size: 42px;
            color: #e5b7ff;
            margin-bottom: 10px;
        }

        header p {
            color: #ddd;
            font-size: 18px;
        }

        .members {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 25px;
            padding: 30px;
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: 0.3s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 30px rgba(200, 130, 255, 0.4);
        }

        .card img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #d9a7ff;
            margin-bottom: 15px;
        }

        .card h2 {
            color: #f0cfff;
            margin-bottom: 8px;
        }

        .card p {
            color: #ddd;
        }

        .welcome {
            text-align: center;
            margin: 10px 20px 30px;
        }

        .welcome button {
            background: #a855f7;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        .welcome button:hover {
            background: #c084fc;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #cdb8dc;
        }
    </style>
</head>

<body>

    <header>
        <h1>💜 BTS Fan World 💜</h1>
        <p>Welcome to your aesthetic BTS fan app</p>
    </header>

    <section class="welcome">
        <h2>✨ Choose Your Favorite Member ✨</h2>
        <button>Explore BTS</button>
    </section>

    <section class="members">

        <div class="card">
    <a href="RM.1.HTML">
        <img src="RM.jpg" alt="RM">
    </a>
    <h2>RM</h2>
    <p>Leader • Rapper</p>
</div>

        <div class="card">
            <a href="JIN.2.html">
            <img src="jin.jpg" alt="Jin">
            </a>

            <p>Vocalist</p>
        </div>

        <div class="card">
            <a href="SUGA.3.html">
            <img src="suga.jpg" alt="SUGA">
            </a>
            <h2>SUGA</h2>
            <p>Rapper • Producer</p>
        </div>

        <div class="card">
            <a href="j hope.4.html">
            <img src="j hope.jpg" alt="j-hope">
            </a>
            <h2>j-hope</h2>
            <p>Rapper • Dancer</p>
        </div>

        <div class="card">
            <a href="JIMIN.5.html">
            <img src="jimin.jpg" alt="Jimin">
            </a>
            <h2>Jimin</h2>
            <p>Vocalist • Dancer</p>
        </div>

        <div class="card">
            <a href="V.6.html">
            <img src="Bts V.jpg" alt="V">
            </a>

        </div>

        <div class="card">
            <a href="junkook.7.html">
            <img src="junkook.jpg" alt="Jung Kook">
            </a>
            <h2>Jung Kook</h2>
            <p>Vocalist • Performer</p>
        </div>

    </section>

    <footer>
        💜 Made with love for BTS fans 💜
    </footer>

</body>
</html>
